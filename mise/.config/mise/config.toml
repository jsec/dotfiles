[tools]
bun = "latest"
go = "latest"
node = "24.11.0"
pnpm = "latest"
"npm:@nestjs/cli" = "latest"
"npm:@vtsls/language-server" = "latest"
"npm:neovim" = "latest"
"npm:prettier" = "latest"
"npm:typescript" = "latest"
"npm:vscode-langservers-extracted" = "latest"
